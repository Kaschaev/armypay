name: Build Android APK and AAB for RuStore

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Android scaffold, set Russian name and Blue Star Icon
        run: |
          mkdir temp_app
          flutter create --org ru.milpay --project-name mil_pay_calc temp_app
          cp -r temp_app/android ./android
          rm -rf temp_app
          
          # Русское название приложения
          sed -i 's/android:label="mil_pay_calc"/android:label="Калькулятор ДД"/g' android/app/src/main/AndroidManifest.xml

          # Установка ImageMagick
          sudo apt-get update && sudo apt-get install -y imagemagick

          # Векторная иконка: Золотая маршальская звезда на темно-синем фоне
          cat << 'EOF' > icon.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
            <rect width="512" height="512" rx="115" fill="#1A237E"/>
            <circle cx="256" cy="256" r="210" fill="none" stroke="#FFD700" stroke-width="14"/>
            <polygon points="256,70 312,205 456,205 340,290 384,425 256,340 128,425 172,290 56,205 200,205" fill="#FFD700" stroke="#FFA000" stroke-width="8"/>
          </svg>
          EOF

          # Удаляем адаптивные XML заглушки, которые давали белый фон
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

          # Нарезаем обычные и круглые значки во все папки разрешений
          for dir in android/app/src/main/res/mipmap-*; do
            convert -background none icon.svg -resize 192x192 "$dir/ic_launcher.png"
            convert -background none icon.svg -resize 192x192 "$dir/ic_launcher_round.png"
          done

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Build Release App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustore-release-builds
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
