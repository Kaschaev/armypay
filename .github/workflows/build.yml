name: Build Android APK and AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Android scaffold, set Russian name and Patriotic App Icon
        run: |
          mkdir temp_app
          flutter create --org ru.milpay --project-name mil_pay_calc temp_app
          cp -r temp_app/android ./android
          rm -rf temp_app
          
          # 1. Русское название на рабочем столе телефона
          sed -i 's/android:label="mil_pay_calc"/android:label="Калькулятор ДД"/g' android/app/src/main/AndroidManifest.xml

          # 2. Установка утилиты генерации изображений
          sudo apt-get update && sudo apt-get install -y imagemagick

          # 3. Создаем векторную иконку: Флаг России + Золотая звезда + Обвивающая Георгиевская лента
          cat << 'EOF' > icon.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
            <defs>
              <clipPath id="squircle">
                <rect width="512" height="512" rx="115" ry="115" />
              </clipPath>
              <!-- Градиент для объемной золотой звезды -->
              <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FFF2A3" />
                <stop offset="45%" stop-color="#FFD700" />
                <stop offset="100%" stop-color="#D48800" />
              </linearGradient>
              <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
              </filter>
            </defs>

            <g clip-path="url(#squircle)">
              <!-- 1. Фон: Флаг России -->
              <rect x="0" y="0" width="512" height="170.6" fill="#F8FAFC" />
              <rect x="0" y="170.6" width="512" height="170.8" fill="#0039A6" />
              <rect x="0" y="341.4" width="512" height="170.6" fill="#D52B1E" />

              <!-- Тонкая внутренняя рамка значка -->
              <rect width="512" height="512" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.3" />

              <!-- 2. Георгиевская лента (нижний изгиб под звездой) -->
              <g filter="url(#shadow)">
                <path d="M-40,430 C120,470 230,350 360,370 C430,380 490,420 550,460" fill="none" stroke="#1A1A1A" stroke-width="45" stroke-linecap="round"/>
                <path d="M-40,430 C120,470 230,350 360,370 C430,380 490,420 550,460" fill="none" stroke="#FF6600" stroke-width="27" stroke-linecap="round"/>
                <path d="M-40,430 C120,470 230,350 360,370 C430,380 490,420 550,460" fill="none" stroke="#1A1A1A" stroke-width="9" stroke-linecap="round"/>
              </g>

              <!-- Золотое кольцо обрамления -->
              <circle cx="256" cy="256" r="185" fill="none" stroke="url(#goldGrad)" stroke-width="9" filter="url(#shadow)" opacity="0.9" />

              <!-- 3. Золотая маршальская звезда -->
              <polygon points="256,92 306,214 436,214 331,291 371,413 256,336 141,413 181,291 76,214 206,214"
                       fill="url(#goldGrad)" stroke="#B37400" stroke-width="5" stroke-linejoin="round" filter="url(#shadow)" />

              <!-- Лучи грани звезды -->
              <line x1="256" y1="92" x2="256" y2="280" stroke="#FFF7C2" stroke-width="3" opacity="0.7"/>
              <line x1="436" y1="214" x2="256" y2="280" stroke="#B37400" stroke-width="3" opacity="0.6"/>
              <line x1="371" y1="413" x2="256" y2="280" stroke="#B37400" stroke-width="3" opacity="0.6"/>
              <line x1="141" y1="413" x2="256" y2="280" stroke="#FFF7C2" stroke-width="3" opacity="0.7"/>
              <line x1="76" y1="214" x2="256" y2="280" stroke="#FFF7C2" stroke-width="3" opacity="0.7"/>

              <!-- 4. Георгиевская лента (верхний перекрестный виток, обвивающий звезду с левого плеча на правый бок) -->
              <g filter="url(#shadow)">
                <path d="M -30,130 Q 140,240 280,260 T 540,190" fill="none" stroke="#1A1A1A" stroke-width="38" stroke-linecap="round" />
                <path d="M -30,130 Q 140,240 280,260 T 540,190" fill="none" stroke="#FF6600" stroke-width="22" stroke-linecap="round" />
                <path d="M -30,130 Q 140,240 280,260 T 540,190" fill="none" stroke="#1A1A1A" stroke-width="7" stroke-linecap="round" />
              </g>
            </g>
          </svg>
          EOF

          # Нарезка иконки под все плотности экранов Android
          for dir in android/app/src/main/res/mipmap-*; do
            convert -background none icon.svg -resize 192x192 "$dir/ic_launcher.png"
          done

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mil-calculator-apk
          path: build/app/outputs/flutter-apk/app-release.apk
