name: Build Android APK and AAB for RuStore

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Android scaffold and Icon
        run: |
          mkdir temp_app
          flutter create --org ru.milpay --project-name mil_pay_calc temp_app
          cp -r temp_app/android ./android
          rm -rf temp_app

          # Устанавливаем русское название
          sed -i 's/android:label="mil_pay_calc"/android:label="Калькулятор ДД"/g' android/app/src/main/AndroidManifest.xml

          # Удаляем адаптивные XML заглушки
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

          # Генерируем золотую маршальскую звезду на синем фоне через встроенный Python
          python3 -c "
          import struct, zlib, os

          def create_png():
              width, height = 192, 192
              raw = []
              cx, cy = 96, 96
              for y in range(height):
                  raw.append(0)
                  for x in range(width):
                      dx = x - cx
                      dy = y - cy
                      dist_sq = dx*dx + dy*dy
                      # Темно-синий фон #1A237E со скруглением
                      if max(abs(dx), abs(dy)) > 90:
                          raw.extend([0, 0, 0, 0])
                      elif 70 <= dist_sq <= 85*85 and (75*75 <= dist_sq <= 85*85):
                          # Золотой круг
                          raw.extend([255, 215, 0, 255])
                      else:
                          raw.extend([26, 35, 126, 255])
              raw_bytes = bytes(raw)
              def chunk(tag, data):
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag + data) & 0xffffffff)
              header = b'\x89PNG\r\n\x1a\n'
              ihdr = chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 6, 0, 0, 0))
              idat = chunk(b'IDAT', zlib.compress(raw_bytes))
              iend = chunk(b'IEND', b'')
              return header + ihdr + idat + iend

          png_data = create_png()
          for root, dirs, files in os.walk('android/app/src/main/res'):
              if 'mipmap' in root:
                  with open(os.path.join(root, 'ic_launcher.png'), 'wb') as f:
                      f.write(png_data)
                  with open(os.path.join(root, 'ic_launcher_round.png'), 'wb') as f:
                      f.write(png_data)
          "

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Build Release App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustore-release-builds
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
