name: Build Android APK and AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Android scaffold, set Russian name and App Icon
        run: |
          mkdir temp_app
          flutter create --org ru.milpay --project-name mil_pay_calc temp_app
          cp -r temp_app/android ./android
          rm -rf temp_app
          
          # Русское название
          sed -i 's/android:label="mil_pay_calc"/android:label="Калькулятор ДД"/g' android/app/src/main/AndroidManifest.xml

          # Генерация профессиональной иконки через Python Pillow
          python3 - << 'EOF'
          import math
          from PIL import Image, ImageDraw

          size = 512
          img = Image.new("RGBA", (size, size), (0, 0, 0, 0))
          draw = ImageDraw.Draw(img)

          # 1. ТРИКОЛОР (Флаг России)
          draw.rectangle([0, 0, size, 171], fill="#FFFFFF")
          draw.rectangle([0, 171, size, 342], fill="#0039A6")
          draw.rectangle([0, 342, size, size], fill="#D52B1E")

          # 2. ЗОЛОТАЯ ЗВЕЗДА В ЦЕНТРЕ
          cx, cy = 256, 256
          r_out, r_in = 160, 68
          points = []
          for i in range(10):
              angle = i * math.pi / 5 - math.pi / 2
              r = r_out if i % 2 == 0 else r_in
              points.append((cx + r * math.cos(angle), cy + r * math.sin(angle)))

          # Тень под звездой
          shadow_pts = [(x + 4, y + 8) for (x, y) in points]
          draw.polygon(shadow_pts, fill=(0, 0, 0, 90))

          # Сама звезда
          draw.polygon(points, fill="#FFCC00", outline="#B8860B", width=6)

          # 3. ГЕОРГИЕВСКАЯ ЛЕНТА, ОБВИВАЮЩАЯ СНИЗУ ВВЕРХ
          # Рисуем полосы ленты
          stripes = ["#000000", "#FF6600", "#000000", "#FF6600", "#000000"]
          for s_idx, col in enumerate(stripes):
              offset = (s_idx - 2) * 9
              pts = []
              for t in range(0, 520, 10):
                  x = t
                  # Плавная синусоида диагонального изгиба
                  y = 390 - (t * 0.45) + math.sin(t / 40.0) * 35 + offset
                  pts.append((x, y))
              draw.line(pts, fill=col, width=10, joint="curve")

          img.save("app_icon.png")
          EOF

          # Удаляем адаптивные XML заглушки Android, которые давали белый фон
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

          # Копируем созданную иконку во все папки mipmap
          for res in 48 72 96 144 192; do
            case $res in
              48) dir="mipmap-mdpi" ;;
              72) dir="mipmap-hdpi" ;;
              96) dir="mipmap-xhdpi" ;;
              144) dir="mipmap-xxhdpi" ;;
              192) dir="mipmap-xxxhdpi" ;;
            esac
            mkdir -p "android/app/src/main/res/$dir"
            python3 -c "from PIL import Image; Image.open('app_icon.png').resize(($res, $res), Image.LANCZOS).save('android/app/src/main/res/$dir/ic_launcher.png')"
          done

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mil-calculator-apk
          path: build/app/outputs/flutter-apk/app-release.apk
